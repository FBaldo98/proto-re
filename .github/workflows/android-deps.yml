# Third-party native libraries of the Android port (SDL2, FAudio, DXVK d3d9), built on GitHub's runners.
# Nothing here touches game files or code generated from them: the recompiled engine is built locally only.
name: android-deps

on:
  push:
    paths: [android/build-deps.sh, .github/workflows/android-deps.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: out/${{ matrix.abi }}
          key: android-deps-${{ matrix.abi }}-${{ hashFiles('android/build-deps.sh') }}

      - name: Tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build glslang-tools pkg-config python3-pip
          pip3 install --user --break-system-packages meson==1.5.2

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          export PATH=$HOME/.local/bin:$PATH
          echo "NDK: $ANDROID_NDK_HOME"
          android/build-deps.sh ${{ matrix.abi }} src out/${{ matrix.abi }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-deps-${{ matrix.abi }}
          path: |
            out/${{ matrix.abi }}/lib/*.so
            out/${{ matrix.abi }}/include
          retention-days: 30
